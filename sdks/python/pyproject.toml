[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
# Placeholder distribution name: check availability and publication rights before publishing.
name = "uar-client"
version = "0.6.0"
description = "Python client for the Universal AI Runtime"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[tool.setuptools]
packages = ["uar"]
