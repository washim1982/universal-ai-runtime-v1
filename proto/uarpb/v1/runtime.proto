// Universal AI Runtime — public contract, version 1. Wire package: uar.v1.
// (Stored under proto/uarpb/ so generated Python stubs import as `uarpb`, leaving `uar` to the SDK.)
// This file is the source of truth. OpenAPI and JSON Schemas under contracts/generated
// are produced from it by scripts/gen_contracts.py; never edit them by hand.
//
// JSON mapping: proto3 canonical JSON with original (snake_case) field names.
// Streamed Event messages additionally carry "type": <name of the populated `body` field>.
syntax = "proto3";

package uar.v1;

option go_package = "github.com/washim1982/universal-ai-runtime-v1/sdks/go/uarv1;uarv1";
option java_package = "dev.uar.v1";
option java_multiple_files = true;
option csharp_namespace = "Uar.V1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service Runtime {
  // Synchronous inference. With `agent` set, starts that agent and waits for its result.
  rpc Infer(InferenceRequest) returns (InferenceResponse);
  // Streaming inference: start, token deltas, usage, exactly one terminal event.
  rpc InferStream(InferenceRequest) returns (stream Event);

  rpc ExecuteTool(ToolRequest) returns (ToolResult);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  rpc RegisterAgent(RegisterAgentRequest) returns (AgentVersion);
  rpc StartRun(RunRequest) returns (Run);
  rpc GetRun(GetRunRequest) returns (Run);
  // Ordered, durable run events. Resumable: pass the last seen seq as after_seq.
  rpc WatchRun(WatchRunRequest) returns (stream Event);
  // Idempotent.
  rpc CancelRun(CancelRunRequest) returns (Run);
  // Resolve a run in needs_attention after an ambiguous external write.
  rpc ResolveRun(ResolveRunRequest) returns (Run);

  // Offline: never calls a model, tool, plugin or network endpoint.
  rpc DryRun(DryRunRequest) returns (DryRunReport);

  // Approvals. A decision is bound to the action and the hash of its arguments; it is accepted once,
  // only while pending and unexpired, only from a principal of the same tenant with approvals:decide
  // (and one of the approver roles, when the approval names them), never from the requester.
  rpc DecideApproval(ApprovalDecision) returns (Approval);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc GetApproval(GetApprovalRequest) returns (Approval);

  // Tamper-evident audit (permission audit:read). Each tenant's audit rows form a hash chain.
  rpc VerifyAudit(VerifyAuditRequest) returns (AuditVerification);
  rpc ExportAudit(ExportAuditRequest) returns (ExportAuditResponse);

  // Administration. Tenant-scoped like every other call, except logs and runtime components, which
  // describe the process (restricted to the configured platform tenants).
  rpc GetRuntimeInfo(GetRuntimeInfoRequest) returns (RuntimeInfo);        // admin
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse);            // usage:read
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);      // keys:manage
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreatedApiKey);          // keys:manage
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (ApiKeyInfo);             // keys:manage
  rpc GetAccessPolicy(GetAccessPolicyRequest) returns (AccessPolicy);     // keys:manage
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);               // logs:read

  // Plugins (administrators only). Versions are immutable; activation validates and health-checks
  // the version and affects new runs only (running runs keep the versions they started with).
  rpc RegisterPlugin(RegisterPluginRequest) returns (PluginVersion);
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  rpc ActivatePlugin(ActivatePluginRequest) returns (PluginVersion);
  rpc RollbackPlugin(RollbackPluginRequest) returns (PluginVersion);
}

// ---------- shared ----------

message Money {
  string amount = 1;    // decimal string, e.g. "0.0012"
  string currency = 2;  // ISO 4217
}

message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  // Absent when no price is known for the model. Unknown is never reported as zero.
  Money cost = 3;
  // True when counts or cost are estimates rather than provider-reported values.
  bool estimated = 4;
  string price_version = 5;
}

message Error {
  string code = 1;        // stable machine code, see contracts/errors.md
  string message = 2;     // safe for display
  string request_id = 3;
  bool retryable = 4;
  google.protobuf.Struct details = 5;  // redacted
}

// ---------- inference ----------

message ToolCallRequest {
  string id = 1;
  string name = 2;
  google.protobuf.Struct args = 3;
}

message ChatMessage {
  string role = 1;  // system | user | assistant | tool
  string content = 2;
  repeated ToolCallRequest tool_calls = 3;  // assistant messages
  string tool_call_id = 4;                  // tool messages
}

message GenerationParams {
  optional double temperature = 1;
  optional int32 max_tokens = 2;
  optional double top_p = 3;
  repeated string stop = 4;
  // Request structured output matching this JSON Schema.
  google.protobuf.Struct response_schema = 5;
}

message InferenceRequest {
  // [class ":"] [provider "/"] name   e.g. local:llama3:8b, cloud:default, enterprise:corp/finance-7b
  string model = 1;
  repeated ChatMessage messages = 2;
  // Shorthand for a single user message; ignored when messages is non-empty.
  string input = 3;
  // Registered tool names exposed to the model for function calling.
  repeated string tools = 4;
  string tool_mode = 5;  // "suggest" (default) | "auto"
  // When set, runs this agent with {"prompt": <input>} and returns its result.
  string agent = 6;
  bool stream = 7;
  GenerationParams params = 8;
  string data_class = 9;  // public | internal | confidential (policy input)
  // Provider-specific extensions, namespaced by provider id, e.g. {"ollama": {"keep_alive": "5m"}}.
  google.protobuf.Struct extensions = 10;
}

message InferenceResponse {
  string request_id = 1;
  string provider = 2;
  string model = 3;  // resolved provider model id
  string content = 4;
  string finish_reason = 5;  // stop | length | tool_calls | cancelled | error
  repeated ToolCallRequest tool_calls = 6;
  Usage usage = 7;
  string run_id = 8;  // set when the call ran an agent or the auto tool loop
  google.protobuf.Struct output = 9;  // agent structured output, if any
  RouteDecision route = 10;
}

message RouteDecision {
  string requested = 1;
  string model_class = 2;
  string provider = 3;
  string model = 4;
  repeated string reasons = 5;
  bool fallback_used = 6;
}

// ---------- tools ----------

message ToolRequest {
  string tool = 1;  // namespaced, e.g. fs.read_text
  google.protobuf.Struct args = 2;
  string idempotency_key = 3;
}

message ContentBlock {
  string type = 1;  // text | json
  string text = 2;
  google.protobuf.Struct json = 3;
}

message ToolResult {
  string request_id = 1;
  string tool = 2;
  bool is_error = 3;
  repeated ContentBlock content = 4;
  google.protobuf.Struct structured = 5;
  bool truncated = 6;
  // Tool output is untrusted data and must never be treated as instructions.
  bool untrusted = 7;
  int32 duration_ms = 8;
}

message ToolInfo {
  string name = 1;
  string server = 2;
  string description = 3;
  google.protobuf.Struct input_schema = 4;
  string side_effect = 5;  // read | write | external
}

message ListToolsRequest {}
message ListToolsResponse { repeated ToolInfo tools = 1; }

// ---------- models ----------

message ModelInfo {
  string name = 1;         // alias or class-qualified name
  string model_class = 2;  // local | cloud | enterprise
  string provider = 3;
  string model = 4;
  repeated string capabilities = 5;  // chat, stream, tools, json, vision
  bool available = 6;
}

message ListModelsRequest {}
message ListModelsResponse { repeated ModelInfo models = 1; }

// ---------- agents & runs ----------

message RegisterAgentRequest {
  // Agent document (apiVersion uar/v1, kind Agent), validated against
  // contracts/schemas/agent.schema.json.
  google.protobuf.Struct definition = 1;
}

message AgentVersion {
  string agent_id = 1;
  string version = 2;
  string digest = 3;  // sha256 of canonical JSON
  google.protobuf.Timestamp created_at = 4;
  repeated string warnings = 5;
}

message RunRequest {
  string agent_id = 1;
  string version = 2;  // empty = latest registered
  google.protobuf.Struct input = 3;
  string idempotency_key = 4;
}

message Run {
  string run_id = 1;
  string agent_id = 2;
  string version = 3;
  // queued | running | waiting_approval | succeeded | failed | cancelled | needs_attention
  string status = 4;
  google.protobuf.Struct output = 5;
  Error error = 6;
  Usage usage = 7;
  int32 steps = 8;
  string current_node = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string parent_run_id = 12;
  bool cancel_requested = 13;
}

message GetRunRequest { string run_id = 1; }
message WatchRunRequest { string run_id = 1; uint32 after_seq = 2; }
message CancelRunRequest { string run_id = 1; string reason = 2; }
message ResolveRunRequest {
  string run_id = 1;
  string action = 2;  // mark_completed | retry_node | fail
  string note = 3;
}

// ---------- events (the typed envelope) ----------

message Started { string model = 1; string provider = 2; string agent_id = 3; }
message TokenDelta { string text = 1; }
message ToolCallEvent { string id = 1; string tool = 2; google.protobuf.Struct args = 3; string node_id = 4; }
message ToolResultEvent { string id = 1; string tool = 2; bool is_error = 3; string summary = 4; string node_id = 5; }
message NodeStarted { string node_id = 1; string node_type = 2; int32 attempt = 3; }
message NodeCompleted { string node_id = 1; string outcome = 2; int32 duration_ms = 3; string next = 4; }
message ApprovalRequired {
  string approval_id = 1;
  string action = 2;
  string args_hash = 3;
  string node_id = 4;
  string expires_at = 5;
}
message Completed {
  string status = 1;
  string content = 2;
  google.protobuf.Struct output = 3;
  string finish_reason = 4;
}

message Event {
  string run_id = 1;
  uint32 seq = 2;
  google.protobuf.Timestamp ts = 3;
  string trace_id = 4;
  string request_id = 5;
  oneof body {
    Started started = 10;
    TokenDelta token = 11;
    ToolCallEvent tool_call = 12;
    ToolResultEvent tool_result = 13;
    NodeStarted node_started = 14;
    NodeCompleted node_completed = 15;
    Usage usage = 16;
    ApprovalRequired approval_required = 17;
    Error error = 18;      // terminal
    Completed completed = 19;  // terminal
  }
}

// ---------- dry-run ----------

message DryRunRequest {
  oneof target {
    string agent_id = 1;                    // a registered agent (latest or `version`)
    google.protobuf.Struct definition = 2;  // an unregistered agent document
    InferenceRequest inference = 3;         // routing preview only
  }
  string version = 4;
  google.protobuf.Struct input = 5;
  string mode = 6;  // "static" (default) | "simulate"
  // simulate: node_id -> fixture output (or list of outputs for repeated visits)
  google.protobuf.Struct fixtures = 7;
  int64 seed = 8;
}

message PlannedStep {
  string node_id = 1;
  string node_type = 2;
  string detail = 3;  // model route, tool name, sub-agent
  repeated string permissions = 4;
  string status = 5;  // planned | simulated | unresolved | denied
  google.protobuf.Struct output = 6;  // simulate mode, from fixtures only
}

message DryRunReport {
  string request_id = 1;
  string mode = 2;
  bool valid = 3;
  repeated string errors = 4;
  repeated string warnings = 5;
  repeated PlannedStep steps = 6;
  repeated RouteDecision routes = 7;
  repeated string permissions_required = 8;
  repeated string permissions_missing = 9;
  repeated string unresolved = 10;
  repeated string branches = 11;  // enumerated paths, static mode
  int32 estimated_input_tokens_max = 12;
  int32 estimated_output_tokens_max = 13;
  Money estimated_cost_max = 14;  // absent when any price is unknown
  bool executed_nothing = 15;     // always true; asserted by tests
}

// ---------- approvals ----------

message ApprovalDecision {
  string approval_id = 1;
  bool approve = 2;
  string comment = 3;
  // Optional: when set it must equal the approval's args_hash (the approver saw these arguments).
  string args_hash = 4;
}

message Approval {
  string approval_id = 1;
  string status = 2;  // pending | approved | rejected | expired | cancelled
  string run_id = 3;
  string node_id = 4;
  string kind = 5;    // node (approval node) | tool (inline approval of a tool call)
  string action = 6;  // approval node action, or the tool name
  string args_hash = 7;
  google.protobuf.Struct summary = 8;  // what the approver is asked to approve (redacted)
  repeated string approver_roles = 9;
  string requested_by = 10;
  string decided_by = 11;
  string comment = 12;
  string created_at = 13;
  string expires_at = 14;
  string decided_at = 15;
  bool consumed = 16;  // the approved action has been performed (an approval is usable once)
}

message ListApprovalsRequest { string status = 1; string run_id = 2; }
message ListApprovalsResponse { repeated Approval approvals = 1; }
message GetApprovalRequest { string approval_id = 1; }

// ---------- audit ----------

message VerifyAuditRequest {}

message AuditVerification {
  bool ok = 1;
  int64 rows = 2;            // chained rows checked
  int64 first_seq = 3;
  int64 last_seq = 4;
  string head_hash = 5;
  int64 broken_at_seq = 6;   // first row that fails verification (0 = none)
  string problem = 7;
  int64 unchained_rows = 8;  // rows written before the chain existed (migration 0003)
  int64 anchor_seq = 9;      // retention pruned the chain up to this row
}

message AuditRecord {
  int64 seq = 1;
  string ts = 2;
  string actor = 3;
  string action = 4;
  string target = 5;
  string outcome = 6;
  string request_id = 7;
  string run_id = 8;
  string policy_version = 9;
  google.protobuf.Struct details = 10;
  string prev_hash = 11;
  string hash = 12;
}

message ExportAuditRequest { int64 after_seq = 1; int32 limit = 2; }
message ExportAuditResponse { repeated AuditRecord records = 1; int64 next_after_seq = 2; string head_hash = 3; }

// ---------- plugins ----------

message RegisterPluginRequest {
  // Plugin manifest (apiVersion uar/v1, kind Plugin), validated against
  // contracts/schemas/plugin.schema.json.
  google.protobuf.Struct manifest = 1;
}

message PluginVersion {
  string plugin_id = 1;
  string version = 2;
  string type = 3;     // model | tool | agent
  string status = 4;   // registered | active | inactive | failed
  string digest = 5;   // sha256 of the canonical manifest
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated string capabilities = 8;
  string message = 9;  // validation or health-check detail
  string previous_version = 10;
}

message ListPluginsRequest {}
message ListPluginsResponse { repeated PluginVersion plugins = 1; }
message ActivatePluginRequest { string plugin_id = 1; string version = 2; }
message RollbackPluginRequest { string plugin_id = 1; }

// ---------- administration ----------

message GetRuntimeInfoRequest {}

message ComponentStatus {
  string name = 1;
  string kind = 2;    // database | provider | mcp_server | plugin | oidc | worker
  string status = 3;
  bool ok = 4;
}

message RuntimeInfo {
  string version = 1;
  string profile = 2;
  string started_at = 3;
  int64 uptime_s = 4;
  string host = 5;
  int32 pid = 6;
  bool worker = 7;
  repeated string migrations = 8;
  repeated ComponentStatus components = 9;
  string tenant = 10;   // the caller's tenant and subject
  string subject = 11;
  bool platform_admin = 12;  // may read process-wide logs
}

message UsageRecord {
  int64 id = 1;
  string ts = 2;
  string subject = 3;
  string request_id = 4;
  string run_id = 5;
  string provider = 6;
  string model = 7;
  int32 input_tokens = 8;
  int32 output_tokens = 9;
  Money cost = 10;        // absent when the price is unknown
  bool estimated = 11;
  string price_version = 12;
}

message ListUsageRequest {
  int64 before_id = 1;    // paging: records with a smaller id (0 = newest)
  int32 limit = 2;
  string subject = 3;
  string model = 4;       // substring of provider/model
  string since = 5;       // RFC 3339
}

message ListUsageResponse {
  repeated UsageRecord records = 1;
  int64 next_before_id = 2;
  int64 total_requests = 3;        // for the filter, all pages
  int64 total_input_tokens = 4;
  int64 total_output_tokens = 5;
  Money total_cost = 6;            // known prices only
}

message ApiKeyInfo {
  string key_id = 1;
  string subject = 2;
  repeated string roles = 3;
  string source = 4;       // config (read-only here) | api
  string description = 5;
  string created_by = 6;
  string created_at = 7;
  string expires_at = 8;
  string revoked_at = 9;
  string status = 10;      // active | expired | revoked
}

message ListApiKeysRequest { bool include_revoked = 1; }
message ListApiKeysResponse { repeated ApiKeyInfo keys = 1; }

message CreateApiKeyRequest {
  string subject = 1;
  repeated string roles = 2;
  string description = 3;
  int32 expires_in_days = 4;  // 0 = no expiry
}

// The secret is returned once; the runtime stores only its SHA-256.
message CreatedApiKey { ApiKeyInfo key = 1; string api_key = 2; }

message RevokeApiKeyRequest { string key_id = 1; string reason = 2; }

message GetAccessPolicyRequest {}
message RoleInfo { string name = 1; repeated string permissions = 2; }
message RoleMapping { string source = 1; string kind = 2; repeated string roles = 3; }  // kind: group | subject
message OidcIssuerInfo { string issuer = 1; string audience = 2; string keys = 3; repeated RoleMapping mappings = 4; }

message AccessPolicy {
  string tenant = 1;
  repeated RoleInfo roles = 2;
  repeated OidcIssuerInfo oidc = 3;
  repeated string permissions = 4;   // every permission the runtime knows
}

message LogRecord {
  int64 seq = 1;
  string ts = 2;
  string level = 3;
  string logger = 4;
  string message = 5;
  google.protobuf.Struct fields = 6;
}

message ListLogsRequest { int64 after_seq = 1; int32 limit = 2; string min_level = 3; }
message ListLogsResponse { repeated LogRecord records = 1; int64 next_after_seq = 2; int32 capacity = 3; }

