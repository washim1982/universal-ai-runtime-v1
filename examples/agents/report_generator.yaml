# Report generator: database query -> local model analysis -> authorized file write.
apiVersion: uar/v1
kind: Agent
metadata:
  id: report_generator
  version: 1.0.0
  description: Summarises quarterly sales from the read-only sales database into a Markdown report.
spec:
  input:
    type: object
    required: [report_name]
    additionalProperties: false
    properties:
      report_name: {type: string, pattern: "^[a-z0-9_-]{1,40}$"}
      quarter: {type: string, pattern: "^20[0-9]{2}-Q[1-4]$"}
  output:
    type: object
    required: [path, title]
  permissions:
    models: ["local:*"]
    tools: ["db.query", "fs.write_text"]
  limits: {max_steps: 10, timeout_s: 300, max_tokens: 12000}
  start: sales
  nodes:
    - id: sales
      type: tool
      tool: db.query
      retry: {max_attempts: 2}
      args:
        sql: >-
          SELECT s.region, p.name AS product, SUM(s.units) AS units,
                 ROUND(SUM(s.units * p.unit_price), 2) AS revenue
          FROM sales s JOIN products p ON p.sku = s.sku
          WHERE s.quarter = ?
          GROUP BY s.region, p.name ORDER BY revenue DESC
        params: ["${ has(input.quarter) ? input.quarter : '2026-Q2' }"]
    - id: analyse
      type: llm
      model: local:default
      retry: {max_attempts: 2}
      params: {max_tokens: 900, temperature: 0.2}
      system: You are a precise business analyst. Use only the numbers you are given. Do not invent data.
      prompt: |
        Sales for {{ has(input.quarter) ? input.quarter : '2026-Q2' }}.
        Columns: {{ nodes.sales.output.columns }}
        Rows: {{ nodes.sales.output.rows }}
        Write a short report: a title, then a Markdown body with 3 to 5 bullet points
        covering top products, strongest and weakest regions, and total revenue.
      output_schema:
        type: object
        required: [title, body]
        properties:
          title: {type: string}
          body: {type: string}
    - id: render
      type: transform
      value: "${ '# ' + nodes.analyse.output.title + '\\n\\n' + nodes.analyse.output.body + '\\n' }"
    - id: write
      type: tool
      tool: fs.write_text
      args:
        path: "reports/${ input.report_name }.md"
        content: "${ nodes.render.output }"
    - id: done
      type: return
      value: "${ {'path': 'reports/' + input.report_name + '.md', 'title': nodes.analyse.output.title} }"
  edges:
    - {from: sales, to: analyse}
    - {from: analyse, to: render}
    - {from: render, to: write}
    - {from: write, to: done}
