name: ci
on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: uar, POSTGRES_PASSWORD: uar-dev, POSTGRES_DB: uar}
        ports: ["55440:5432"]
        options: >-
          --health-cmd "pg_isready -U uar" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.27"}
      - uses: actions/setup-java@v4
        with: {distribution: microsoft, java-version: "21", cache: maven}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" -e sdks/python
          python scripts/make_fixtures.py
      - name: Contracts are current and compatible
        run: |
          python scripts/gen_contracts.py --check
          python scripts/check_breaking.py
          python scripts/gen_ts_types.py --check
      - name: Reference plugins (Go, TypeScript, .NET, Java)
        run: |
          (cd plugins/reference/go-model && go build -o sentiment .)
          (cd plugin-sdks/typescript && npm install --no-audit --no-fund)
          (cd plugins/reference/ts-tool && npm install --no-audit --no-fund)
          dotnet build -c Release plugins/reference/dotnet-tool
          dotnet build -c Release admin-app/UarAdmin   # Windows admin app (builds anywhere via EnableWindowsTargeting)
          mvn -q -B -f plugin-sdks/java install
          mvn -q -B -f plugins/reference/java-agent package
      - name: Go, Rust, .NET and Java SDKs against uar-mock
        env: {UAR_PYTHON: python}
        run: |
          (cd sdks/go && go test ./...)
          (cd sdks/rust && cargo test --quiet)
          (cd sdks/dotnet && dotnet run --project Uar.Client.Conformance)
          mvn -q -B -f sdks/java test
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: npm ci || npm install && npm run build && npm test
      - name: Python SDK against uar-mock
        run: python -m pytest -q -o addopts="" sdks/python/tests
      - name: Language samples compile (samples/)
        run: |
          python -m py_compile samples/python/inference.py
          (cd samples/typescript && npm install --no-audit --no-fund && node --check inference.ts)
          (cd samples/go && go vet .)
          (cd samples/rust && cargo build --quiet)
          dotnet build samples/dotnet
          mvn -q -B -f sdks/java install -DskipTests && mvn -q -B -f samples/java compile
      - name: Runtime (unit, contract, integration, recovery, security, dry-run, live-SDK conformance)
        run: python -m pytest -q
      - name: Container image and sandbox
        if: matrix.python == '3.14'
        run: |
          docker build -f deploy/docker/Dockerfile -t uar-runtime:0.9.0 .
          python -m pytest -q -m docker -o addopts="" runtime/tests/test_mcp.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          printf 'profile: standard\n' > /tmp/cfg.yaml
          helm lint deploy/helm/uar --set-file config=/tmp/cfg.yaml
          helm template uar deploy/helm/uar --set-file config=/tmp/cfg.yaml > /tmp/rendered.yaml
