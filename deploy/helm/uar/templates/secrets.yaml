{{- if not .Values.config }}
{{- fail "config is required: helm install ... --set-file config=.local/uar-k8s.yaml" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "uar.labels" . | nindent 4 }}
type: Opaque
stringData:
  uar.yaml: |
{{ .Values.config | indent 4 }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "uar.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # keep the password with the retained data volume
type: Opaque
stringData:
  password: {{ include "uar.pgPassword" . | quote }}
{{- end }}
{{- if .Values.providerSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-provider-secrets
  labels: {{- include "uar.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.providerSecrets }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
