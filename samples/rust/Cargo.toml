[package]
name = "uar-sample"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
uar-client = { path = "../../sdks/rust" }   # the SDK from this repository (library name `uar`)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }   # only for the token request
serde_json = "1"

